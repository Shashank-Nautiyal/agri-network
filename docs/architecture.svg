<svg width="680" height="432" viewBox="0 0 680 432" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>KhetSaathi system architecture</title>
  <desc>Four-tier flow: farmer's browser, static frontend, Spring Boot backend, and Python AI service, connected by REST calls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B6151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="432" fill="#FBF8F1"/>

  <g>
    <rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
    <text x="340" y="49" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Farmer</text>
    <text x="340" y="68" text-anchor="middle" font-size="12" fill="#5F5E5A">Web browser, mobile-first</text>
  </g>

  <line x1="340" y1="86" x2="340" y2="132" stroke="#6B6151" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="112" font-size="12" fill="#6B6151">Opens app</text>

  <g>
    <rect x="190" y="132" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
    <text x="340" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Frontend</text>
    <text x="340" y="170" text-anchor="middle" font-size="12" fill="#0F6E56">Static HTML, CSS, JS</text>
  </g>

  <line x1="340" y1="188" x2="340" y2="234" stroke="#6B6151" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="214" font-size="12" fill="#6B6151">REST (JSON)</text>

  <g>
    <rect x="190" y="234" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.75"/>
    <text x="340" y="253" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Spring Boot backend</text>
    <text x="340" y="272" text-anchor="middle" font-size="12" fill="#534AB7">Java 17 + Firestore</text>
  </g>

  <line x1="340" y1="290" x2="340" y2="336" stroke="#6B6151" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="350" y="316" font-size="12" fill="#6B6151">REST (JSON)</text>

  <g>
    <rect x="190" y="336" width="300" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
    <text x="340" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">AI service</text>
    <text x="340" y="374" text-anchor="middle" font-size="12" fill="#993C1D">FastAPI, Gemini, Earth Engine</text>
  </g>
</svg>
